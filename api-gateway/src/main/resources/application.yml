server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: upi-payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/upi/**
        - id: fraud-detection-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/fraud/**
        - id: admin-monitoring-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/admin/**
